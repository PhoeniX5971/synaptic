name: Qualification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-python313:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_CACHE_DIR: ${{ runner.temp }}/synaptic-uv-cache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.12.10"
          enable-cache: false
      - name: Install frozen development environment
        run: uv sync --frozen --all-extras --python 3.13.8
      - name: Runtime and full-package typing gate
        run: uv run --frozen --all-extras python scripts/check_quality.py
      - name: Distributions and installed consumer checks
        run: uv run --frozen --all-extras python scripts/check_release.py
