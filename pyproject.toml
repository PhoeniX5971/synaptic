[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synaptic"
version = "0.1.0"
description = "An orchestration framework for large language models"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{ name = "phoenix5971" }]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3", "jsonschema>=4.26,<5"]

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]
openai = ["openai>=2.16,<3"]
deepseek = ["openai>=2.16,<3"]
claude = ["anthropic>=0.84,<1"]
gemini = ["google-genai>=1.61,<2"]
vertex = ["google-cloud-aiplatform>=1.71,<2"]
together = ["together>=2.2,<3"]
xai = ["xai-sdk>=1.8,<2"]
all = ["synaptic[mcp,openai,deepseek,claude,gemini,vertex,together,xai]"]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "ruff==0.15.6",
    "mypy==1.19.1",
    "uvicorn==0.52.4",
    "starlette==1.6.0",
    "types-jsonschema==4.26.0.20260518",
]

[tool.setuptools.packages.find]
include = ["synaptic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
constraint-dependencies = [
  "mcp==1.30.0", "openai==2.16.0", "anthropic==0.84.0",
  "google-genai==1.61.0", "google-cloud-aiplatform==1.71.1",
  "together==2.2.0", "xai-sdk==1.8.1", "pydantic==2.12.5",
  "jsonschema==4.26.0", "httpx==0.28.1", "anyio==4.12.1",
]

[tool.mypy]
files = ["synaptic"]
check_untyped_defs = true
incremental = false
warn_unused_ignores = true

# These pinned SDKs ship no py.typed marker. Only their import boundary is untyped.
[[tool.mypy.overrides]]
module = ["vertexai", "vertexai.*", "xai_sdk", "xai_sdk.*"]
ignore_missing_imports = true
